services:

  # Infrastructure

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: username
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: username
      MINIO_ROOT_PASSWORD: password
      MINIO_BUCKET: transport-documents
      MINIO_REGION: eu-west-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"

        mc mb \
          --ignore-existing \
          --region "$${MINIO_REGION}" \
          "local/$${MINIO_BUCKET}"

        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc stat "local/$${MINIO_BUCKET}"

volumes:
  minio-data:
