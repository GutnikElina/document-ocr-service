spring:
  application:
    name: logistics-document-ocr-service
  ai:
    model:
      chat: ollama
    ollama:
      chat:
        model: gpt-oss:20b
        keep-alive: 10m
        temperature: 0
        num-ctx: 8192
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 51MB
      file-size-threshold: 0B
      location: /var/lib/logistics-ocr/staging

storage:
  minio:
    read-timeout: 10s
    write-timeout: 10s
    connect-timeout: 2s
    access-key: username
    secret-key: password
    bucket: transport-documents
    endpoint: http://localhost:9000

document:
  upload:
    max-file-size: 52428800
    staging-directory: /var/lib/logistics-ocr/staging
